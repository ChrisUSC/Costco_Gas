name: iOS app

on:
  push:
    paths: [ "ios/**", "public/us_stores.json", ".github/workflows/ios.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "ios/**", "public/us_stores.json", ".github/workflows/ios.yml" ]

permissions:
  contents: read

jobs:
  build:
    name: Kit tests + app build
    runs-on: macos-15

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Test CostcoGasKit
      working-directory: ios/CostcoGasKit
      run: swift test

    - name: Build the app for the simulator
      working-directory: ios
      run: >
        xcodebuild build -quiet
        -project CostcoGas.xcodeproj
        -scheme CostcoGas
        -configuration Debug
        -destination 'generic/platform=iOS Simulator'
        CODE_SIGNING_ALLOWED=NO
