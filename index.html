<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costco Gas Prices Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet & Chart.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Time Adapter (Fixes the X-Axis Spacing) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="header-title">
        <h1>Costco Gas Prices</h1>
        <div class="last-updated" id="lastUpdated">Fetching latest data...</div>
    </div>
    <div class="header-controls">
        <div class="search-wrapper" id="searchWrapper">
            <input type="text" id="searchInput" class="search-box" placeholder="Search city or zip code..." autocomplete="off">
            <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
        </div>

        <!-- Gas Preference Toggle -->
        <div class="gas-toggle" id="gasToggle">
            <button type="button" class="gas-toggle-btn active" id="btn-regular" data-gas-pref="regular">Regular</button>
            <button type="button" class="gas-toggle-btn" id="btn-premium" data-gas-pref="premium">Premium</button>
            <button type="button" class="gas-toggle-btn" id="btn-diesel" data-gas-pref="diesel">Diesel</button>
        </div>

        <button type="button" class="btn-action btn-near-me" data-action="find-me">📍 Near Me</button>
        <button type="button" class="btn-icon" id="themeToggle" data-action="toggle-theme" title="Toggle Dark Mode">🌙</button>
    </div>
</header>

<div class="app-container" id="appContainer">
    <aside class="sidebar" id="sidebar">
        <div class="tabs" id="sidebarTabs">
            <div class="tab active" id="tab-nearby" data-tab="nearby" role="tab" tabindex="0">Near Me</div>
            <div class="tab" id="tab-lowest" data-tab="lowest" role="tab" tabindex="0">State Lowest</div>
            <div class="tab" id="tab-route" data-tab="route" role="tab" tabindex="0">Route</div>
            <div class="tab" id="tab-search" data-tab="search" role="tab" tabindex="0">All Stores</div>
            <div class="tab" id="tab-favorites" data-tab="favorites" role="tab" tabindex="0">Favorites</div>
        </div>
        <div class="sidebar-content" id="sidebarContent"></div>
    </aside>
    <div id="map"></div>

    <!-- Floating Map Locate Button (Mobile) -->
    <button type="button" class="map-locate-fab" id="mapLocateBtn" data-action="find-me" title="Find stations near me" aria-label="Find stations near me">
        📍
    </button>

    <!-- Mobile Map / List View Toggle Pill -->
    <div class="mobile-view-toggle" id="mobileViewToggle" role="tablist" aria-label="View mode">
        <button type="button" class="mobile-view-btn active" id="btnMobileMap" data-mobile-view="map">
            🗺️ Map
        </button>
        <button type="button" class="mobile-view-btn" id="btnMobileList" data-mobile-view="list">
            📋 List
        </button>
    </div>

    <!-- Mobile Slide-Up Store Detail Card -->
    <div class="mobile-store-sheet" id="mobileStoreSheet" aria-hidden="true">
        <div class="mobile-sheet-handle" data-action="close-mobile-sheet"></div>
        <div id="mobileStoreSheetContent"></div>
    </div>
</div>

<!-- Chart Modal -->
<div class="modal-overlay" id="chartModal">
    <div class="modal-content">
        <button type="button" class="modal-close" data-action="close-modal" aria-label="Close price history modal">×</button>
        <h2 class="modal-title" id="chartTitle">Price History</h2>
        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
