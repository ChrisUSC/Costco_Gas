name: CA Gas Price Frequency Tracker

on:
  schedule:
    # Runs roughly twice an hour (at :13 and :43) to provide redundancy against
    # GitHub Actions schedule queue delays/drops, ensuring at least ~1 run per hour:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/Los_Angeles

concurrency:
  group: ca-gas-price-scrape
  cancel-in-progress: false

jobs:
  track_ca_prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CA frequency price check
        run: python ca_frequency_runner.py

      - name: Run price change velocity analysis
        continue-on-error: true
        run: |
          if [ -f ca_freq_history.json ]; then
            python analyze_price_frequency.py ca_freq_history.json
          fi

      - name: Commit and push updated CA frequency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ca_freq_history.json ca_freq_latest.json
          if git diff --staged --quiet; then
            echo "No price changes detected. Skipping commit."
            exit 0
          fi

          git commit -m "chore(ca-freq): auto-update CA gas prices [$(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M PT')]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin ${{ github.ref_name }}
