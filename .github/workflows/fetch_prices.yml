name: Update Gas Prices

# Started hourly by a scheduled job on Cloudflare via the workflow_dispatch API.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: America/Los_Angeles

concurrency:
  group: gas-price-scrape
  cancel-in-progress: false  # queue overlapping runs instead of letting them race

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Only the US files: this job must never touch the CA frequency files, which
      # ca_frequency_experiment.yml updates on its own schedule.
      - name: Download existing snapshots from R2
        run: python pipeline/r2_sync.py download us_latest.json us_history.json
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Run scraper
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 120
          command: python pipeline/scraper.py 3

      - name: Upload updated snapshots to R2
        run: python pipeline/r2_sync.py upload us_latest.json us_history.json
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

