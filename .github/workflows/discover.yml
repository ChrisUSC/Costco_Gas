name: Discover New Costco Gas Stations
on:
  schedule:
    - cron: '0 8 * * 1'   # every Monday
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: pip install -r requirements.txt
      - run: python pipeline/scraper.py 6

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: auto-discover new Costco gas stations"
          title: "New Costco gas stations discovered"
          body: |
            Automated weekly scan found changes to `public/us_stores.json`. Please review the diff before merging.
          branch: auto/costco-gas-stations
          delete-branch: true
          reviewers: ChrisUSC
          add-paths: |
            public/us_stores.json
