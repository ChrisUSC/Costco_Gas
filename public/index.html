<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costco Gas Prices Dashboard</title>
    <meta name="description" content="Live Costco gas prices on a map: find the cheapest Regular, Premium and Diesel near you or along a route.">
    <meta name="theme-color" content="#ffffff">
    <meta name="color-scheme" content="light dark">
    <!-- Installable web app -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Costco Gas">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Costco Gas Prices">
    <meta property="og:description" content="Live Costco gas prices on a map: find the cheapest Regular, Premium and Diesel near you or along a route.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23005DAA'/%3E%3Cpath d='M50 14C34 14 22 26 22 41c0 21 28 45 28 45s28-24 28-45C78 26 66 14 50 14z' fill='%23E31837' stroke='%23fff' stroke-width='5'/%3E%3Ccircle cx='50' cy='41' r='11' fill='%23fff'/%3E%3C/svg%3E">

    <!-- Leaflet & Chart.js -->
    <!-- Versions are pinned so a CDN release can't change the app unexpectedly, and each file
         carries a Subresource Integrity hash so the browser refuses it if the CDN serves
         different bytes. `crossorigin` is required for the integrity check on a CDN file.
         `defer` keeps the scripts off the critical rendering path and preserves order.
         To upgrade a library: change the version and recompute its hash from the npm package
         (tests/frontend/cdn-integrity.test.mjs does this and fails until the hash matches). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
          integrity="sha384-pmjIAcz2bAn0xukfxADbZIb3t8oRT9Sv0rvO+BR5Csr6Dhqq+nZs59P0pPKQJkEV" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
            integrity="sha384-eXVCORTRlv4FUUgS/xmOyr66XBVraen8ATNLMESp92FKXLAMiKkerixTiBvXriZr" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js"
            integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
    <!-- Chart.js Time Adapter (Fixes the X-Axis Spacing) -->
    <script defer src="https://unpkg.com/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"
            integrity="sha384-cVMg8E3QFwTvGCDuK+ET4PD341jF3W8nO1auiXfuZNQkzbUUiBGLsIQUE+b1mxws" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
<script>
    // Apply the saved (or system) theme before first paint to avoid a light flash.
    (function () {
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
            }
        } catch (e) {}
    })();
</script>

<header class="app-header">
    <div class="header-title">
        <svg class="brand-mark" width="32" height="32" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><rect width="100" height="100" rx="24" fill="#005DAA"/><path d="M50 16C35 16 24 27 24 41.5c0 20 26 42.500 26 42.5s26-22.5 26-42.5C76 27 65 16 50 16z" fill="#E31837" stroke="#fff" stroke-width="5"/><circle cx="50" cy="41" r="10" fill="#fff"/></svg>
        <div class="brand-text">
            <h1>Costco Gas Prices</h1>
            <div class="last-updated" id="lastUpdated" role="status">Loading prices…</div>
        </div>
    </div>
    <div class="header-controls">
        <div class="search-wrapper" id="searchWrapper" role="search">
            <svg class="icon search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" id="searchInput" class="search-box" placeholder="Search city or zip" aria-label="Search city, address or zip code" autocomplete="off" enterkeyhint="search" spellcheck="false">
            <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
        </div>

        <!-- Fuel grade -->
        <div class="gas-toggle" id="gasToggle" role="group" aria-label="Fuel grade">
            <button type="button" class="gas-toggle-btn active" id="btn-regular" data-gas-pref="regular" aria-pressed="false">Regular</button>
            <button type="button" class="gas-toggle-btn" id="btn-premium" data-gas-pref="premium" aria-pressed="false">Premium</button>
            <button type="button" class="gas-toggle-btn" id="btn-diesel" data-gas-pref="diesel" aria-pressed="false">Diesel</button>
        </div>

        <button type="button" class="btn btn-secondary btn-near-me" data-action="find-me"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11 22 2l-9 19-2-8-8-2z"/></svg> Near me</button>
        <button type="button" class="btn btn-icon" id="settingsBtn" data-action="open-settings" title="Settings" aria-label="Settings" aria-haspopup="dialog" aria-controls="settingsModal"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/></svg></button>
        <button type="button" class="btn btn-icon" id="themeToggle" data-action="toggle-theme" title="Toggle dark mode" aria-label="Dark mode" aria-pressed="false"><svg class="icon theme-icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="icon theme-icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg></button>
    </div>
</header>

<div class="app-container" id="appContainer">
    <aside class="sidebar" id="sidebar">
        <button type="button" class="sheet-grabber" id="sheetGrabber" aria-label="Resize station list" aria-expanded="false"><span class="sheet-grabber-bar"></span></button>
        <div class="tabs" id="sidebarTabs" role="tablist" aria-label="Station lists">
            <button type="button" class="tab active" id="tab-nearby" data-tab="nearby" role="tab" aria-selected="true" aria-controls="sidebarContent"><span class="tab-full">Nearby</span><span class="tab-short">Nearby</span></button>
            <button type="button" class="tab" id="tab-lowest" data-tab="lowest" role="tab" aria-selected="false" aria-controls="sidebarContent" tabindex="-1"><span class="tab-full">State lowest</span><span class="tab-short">Lowest</span></button>
            <button type="button" class="tab" id="tab-route" data-tab="route" role="tab" aria-selected="false" aria-controls="sidebarContent" tabindex="-1">Route</button>
            <button type="button" class="tab" id="tab-search" data-tab="search" role="tab" aria-selected="false" aria-controls="sidebarContent" tabindex="-1"><span class="tab-full">All stations</span><span class="tab-short">All</span></button>
            <button type="button" class="tab" id="tab-favorites" data-tab="favorites" role="tab" aria-selected="false" aria-controls="sidebarContent" tabindex="-1">Favorites</button>
        </div>
        <div class="sidebar-content" id="sidebarContent" role="tabpanel">
            <!-- Placeholder until app.js renders (replaced by skeleton cards, then the list) -->
            <p class="empty-msg">Loading stations…</p>
        </div>
        <!-- Phone: store details live inside this same sheet (tablet uses the floating card below) -->
        <section class="sheet-detail" id="sheetDetail" aria-label="Station details" hidden>
            <div id="sheetDetailContent"></div>
        </section>
    </aside>
    <main id="map" aria-label="Map of Costco gas stations"></main>

    <!-- Tablet portrait: show / hide the station list -->
    <button type="button" class="sidebar-toggle" id="sidebarToggle" data-action="toggle-sidebar" aria-controls="sidebar" aria-expanded="true"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg> <span>List</span></button>

    <!-- Desktop / tablet: re-run the nearby search around the visible map -->
    <button type="button" class="search-area-btn" id="searchAreaBtn" data-action="search-this-area" hidden>Search this area</button>

    <!-- Floating Map Locate Button (Mobile) -->
    <button type="button" class="map-locate-fab" id="mapLocateBtn" data-action="find-me" title="Find stations near me" aria-label="Find stations near me">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 11 22 2l-9 19-2-8-8-2z"/></svg>
    </button>

    <!-- Mobile Slide-Up Store Detail Card -->
    <div class="mobile-store-sheet" id="mobileStoreSheet" role="dialog" aria-label="Station details" aria-hidden="true" inert>
        <div class="mobile-sheet-handle" data-action="close-mobile-sheet" role="button" aria-label="Close station details" tabindex="0"></div>
        <div id="mobileStoreSheetContent"></div>
    </div>
</div>

<!-- Chart Modal -->
<div class="modal-overlay" id="chartModal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="chartTitle">
        <button type="button" class="btn btn-icon modal-close" data-action="close-modal" aria-label="Close price history"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <h2 class="modal-title" id="chartTitle">Price history</h2>
        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<!-- Settings -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-content settings-content" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <button type="button" class="btn btn-icon modal-close" data-action="close-settings" aria-label="Close settings"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        <h2 class="modal-title" id="settingsTitle">Settings</h2>
        <form id="settingsForm" class="settings-form" onsubmit="return false">
            <section class="settings-section">
                <h3 class="settings-heading">Map</h3>
                <label class="settings-row">
                    <span class="settings-text">
                        <span class="settings-label">Cluster stations</span>
                        <span class="settings-hint">When zoomed far out, group nearby stations into one bubble. Zoom in to see each station.</span>
                    </span>
                    <input type="checkbox" class="settings-switch" name="clusterMarkers" role="switch">
                </label>
                <label class="settings-row">
                    <span class="settings-text">
                        <span class="settings-label">Colour pins by price</span>
                        <span class="settings-hint">Green, amber and red for the cheapest, middle and most expensive prices in view.</span>
                    </span>
                    <input type="checkbox" class="settings-switch" name="colorPins" role="switch">
                </label>
            </section>

            <section class="settings-section">
                <h3 class="settings-heading">Directions</h3>
                <fieldset class="settings-choice">
                    <legend class="settings-label">Open directions in</legend>
                    <div class="segmented">
                        <label><input type="radio" name="directionsApp" value="google"><span>Google Maps</span></label>
                        <label><input type="radio" name="directionsApp" value="apple"><span>Apple Maps</span></label>
                        <label><input type="radio" name="directionsApp" value="waze"><span>Waze</span></label>
                    </div>
                </fieldset>
            </section>

            <section class="settings-section">
                <h3 class="settings-heading">Appearance</h3>
                <fieldset class="settings-choice">
                    <legend class="settings-label">Theme</legend>
                    <div class="segmented">
                        <label><input type="radio" name="theme" value="light"><span>Light</span></label>
                        <label><input type="radio" name="theme" value="dark"><span>Dark</span></label>
                        <label><input type="radio" name="theme" value="system"><span>System</span></label>
                    </div>
                </fieldset>
            </section>

            <section class="settings-section">
                <h3 class="settings-heading">Start-up</h3>
                <label class="settings-row">
                    <span class="settings-text">
                        <span class="settings-label">Start on tab</span>
                        <span class="settings-hint">The tab you see when you open the app. A shared link to a specific tab opens that tab instead.</span>
                    </span>
                    <select name="defaultTab" class="select settings-select">
                        <option value="nearby">Nearby</option>
                        <option value="lowest">State lowest</option>
                        <option value="route">Route</option>
                        <option value="search">All stations</option>
                        <option value="favorites">Favorites</option>
                    </select>
                </label>
                <label class="settings-row">
                    <span class="settings-text">
                        <span class="settings-label">Use my location automatically</span>
                        <span class="settings-hint">On opening, use your location if you've allowed it, and guess your state from your internet connection (via ipapi.co). The Route tab also starts from your location. Turn off to do none of these; "Near me" and the route's locate button still work when you tap them.</span>
                    </span>
                    <input type="checkbox" class="settings-switch" name="autoLocate" role="switch">
                </label>
            </section>
            <p class="settings-footnote">Settings are saved in this browser only.</p>
        </form>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
