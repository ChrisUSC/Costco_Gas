# XcodeGen spec for the iOS app. Generate the Xcode project with:
#   brew install xcodegen && cd ios && xcodegen generate && open CostcoGas.xcodeproj
# CostcoGas.xcodeproj and CostcoGas/Info.plist are generated (git-ignored): edit this file.
name: CostcoGas
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  CostcoGasKit:
    path: CostcoGasKit
targets:
  CostcoGas:
    type: application
    platform: iOS
    sources:
      - path: CostcoGas
      # The store list from the website, bundled so the very first launch works offline.
      - path: ../public/us_stores.json
        buildPhase: resources
    dependencies:
      - package: CostcoGasKit
    info:
      path: CostcoGas/Info.plist
      properties:
        CFBundleDisplayName: Costco Gas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: Your location is used to show the cheapest Costco gas near you and to start routes from where you are.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: CostcoGas
            CFBundleURLSchemes: [costcogas]
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: tab.nearby
            UIApplicationShortcutItemTitle: Near me
            UIApplicationShortcutItemIconSymbolName: location
          - UIApplicationShortcutItemType: tab.lowest
            UIApplicationShortcutItemTitle: State lowest
            UIApplicationShortcutItemIconSymbolName: trophy
          - UIApplicationShortcutItemType: tab.route
            UIApplicationShortcutItemTitle: Gas along a route
            UIApplicationShortcutItemIconSymbolName: point.topleft.down.to.point.bottomright.curvepath
          - UIApplicationShortcutItemType: tab.favorites
            UIApplicationShortcutItemTitle: Favorites
            UIApplicationShortcutItemIconSymbolName: star
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.costcogas
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
schemes:
  CostcoGas:
    build:
      targets:
        CostcoGas: all
    run:
      config: Debug
    archive:
      config: Release
