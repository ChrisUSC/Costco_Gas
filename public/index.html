<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costco Gas Prices Dashboard</title>
    <meta name="description" content="Live Costco gas prices on a map: find the cheapest Regular, Premium and Diesel near you or along a route.">
    <meta name="theme-color" content="#005DAA">
    <meta name="color-scheme" content="light dark">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Costco Gas Prices">
    <meta property="og:description" content="Live Costco gas prices on a map: find the cheapest Regular, Premium and Diesel near you or along a route.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23005DAA'/%3E%3Cpath d='M50 14C34 14 22 26 22 41c0 21 28 45 28 45s28-24 28-45C78 26 66 14 50 14z' fill='%23E31837' stroke='%23fff' stroke-width='5'/%3E%3Ccircle cx='50' cy='41' r='11' fill='%23fff'/%3E%3C/svg%3E">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet & Chart.js -->
    <!-- Versions are pinned so a CDN release can't change the app unexpectedly.
         `defer` keeps the scripts off the critical rendering path and preserves order. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.js"></script>
    <!-- Chart.js Time Adapter (Fixes the X-Axis Spacing) -->
    <script defer src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>
<script>
    // Apply the saved (or system) theme before first paint to avoid a light flash.
    (function () {
        try {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.body.classList.add('dark-mode');
            }
        } catch (e) {}
    })();
</script>

<header>
    <div class="header-title">
        <h1>Costco Gas Prices</h1>
        <div class="last-updated" id="lastUpdated">Fetching latest data...</div>
    </div>
    <div class="header-controls">
        <div class="search-wrapper" id="searchWrapper">
            <input type="text" id="searchInput" class="search-box" placeholder="Search city or zip code..." autocomplete="off">
            <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
        </div>

        <!-- Gas Preference Toggle -->
        <div class="gas-toggle" id="gasToggle">
            <button type="button" class="gas-toggle-btn active" id="btn-regular" data-gas-pref="regular">Regular</button>
            <button type="button" class="gas-toggle-btn" id="btn-premium" data-gas-pref="premium">Premium</button>
            <button type="button" class="gas-toggle-btn" id="btn-diesel" data-gas-pref="diesel">Diesel</button>
        </div>

        <button type="button" class="btn-action btn-near-me" data-action="find-me">📍 Near Me</button>
        <button type="button" class="btn-icon" id="themeToggle" data-action="toggle-theme" title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="false">🌙</button>
    </div>
</header>

<div class="app-container" id="appContainer">
    <aside class="sidebar" id="sidebar">
        <button type="button" class="sheet-grabber" id="sheetGrabber" aria-label="Resize station list" aria-expanded="false"><span class="sheet-grabber-bar"></span></button>
        <div class="tabs" id="sidebarTabs" role="tablist" aria-label="Station lists">
            <button type="button" class="tab active" id="tab-nearby" data-tab="nearby" role="tab" aria-selected="true" aria-controls="sidebarContent"><span class="tab-full">Near Me</span><span class="tab-short">Nearby</span></button>
            <button type="button" class="tab" id="tab-lowest" data-tab="lowest" role="tab" aria-selected="false" aria-controls="sidebarContent" tabindex="-1"><span class="tab-full">State Lowest</span><span class="tab-short">Lowest</span></button>
            <button type="button" class="tab" id="tab-route" data-tab="route" role="tab" aria-selected="false" aria-controls="sidebarContent" tabindex="-1">Route</button>
            <button type="button" class="tab" id="tab-search" data-tab="search" role="tab" aria-selected="false" aria-controls="sidebarContent" tabindex="-1"><span class="tab-full">All Stores</span><span class="tab-short">All</span></button>
            <button type="button" class="tab" id="tab-favorites" data-tab="favorites" role="tab" aria-selected="false" aria-controls="sidebarContent" tabindex="-1">Favorites</button>
        </div>
        <div class="sidebar-content" id="sidebarContent" role="tabpanel"></div>
        <!-- Phone: store details live inside this same sheet (tablet uses the floating card below) -->
        <section class="sheet-detail" id="sheetDetail" aria-label="Station details" hidden>
            <div id="sheetDetailContent"></div>
        </section>
    </aside>
    <div id="map"></div>

    <!-- Tablet portrait: show / hide the station list -->
    <button type="button" class="sidebar-toggle" id="sidebarToggle" data-action="toggle-sidebar" aria-controls="sidebar" aria-expanded="true">☰ <span>List</span></button>

    <!-- Desktop / tablet: re-run the nearby search around the visible map -->
    <button type="button" class="search-area-btn" id="searchAreaBtn" data-action="search-this-area" hidden>Search this area</button>

    <!-- Floating Map Locate Button (Mobile) -->
    <button type="button" class="map-locate-fab" id="mapLocateBtn" data-action="find-me" title="Find stations near me" aria-label="Find stations near me">
        📍
    </button>

    <!-- Mobile Slide-Up Store Detail Card -->
    <div class="mobile-store-sheet" id="mobileStoreSheet" role="dialog" aria-label="Station details" aria-hidden="true" inert>
        <div class="mobile-sheet-handle" data-action="close-mobile-sheet" role="button" aria-label="Close station details" tabindex="0"></div>
        <div id="mobileStoreSheetContent"></div>
    </div>
</div>

<!-- Chart Modal -->
<div class="modal-overlay" id="chartModal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="chartTitle">
        <button type="button" class="modal-close" data-action="close-modal" aria-label="Close price history modal">×</button>
        <h2 class="modal-title" id="chartTitle">Price History</h2>
        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
