name: Update Gas Prices

on:
  schedule:
    - cron: '0 8,16,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/Los_Angeles

concurrency:
  group: gas-price-scrape
  cancel-in-progress: false  # queue overlapping runs instead of letting them race

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 120
          command: python scraper.py 3

      - name: Commit and push updated JSON files to all branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the files updated by the scraper
          git add us_history.json us_latest.json ca_history.json ca_latest.json local_history.json local_latest.json
          
          if git diff --staged --quiet; then
            echo "No gas price changes detected. Skipping commit."
            exit 0
          fi
          
          # Stash the staged changes
          git stash
          
          # Iterate over all remote branches
          for branch in $(git branch -r | grep -v '\->' | sed 's/origin\///'); do
            echo "--- Updating branch: $branch ---"
            
            git checkout $branch
            git pull origin $branch --rebase
            
            # Forcefully extract the exact files from the stash, overwriting any conflicts
            git checkout stash@{0} -- us_history.json us_latest.json ca_history.json ca_latest.json local_history.json local_latest.json
            
            # Stage the forcefully applied files
            git add us_history.json us_latest.json ca_history.json ca_latest.json local_history.json local_latest.json
            
            # Commit and push if there are changes
            if ! git diff --staged --quiet; then
              git commit -m "chore: auto-update gas prices [$(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M PT')]"
              git push origin $branch
            else
              echo "No changes needed for $branch"
            fi
            
            # Clean up the working directory before moving to the next branch
            git reset --hard
          done
          
          # Clear the stash now that we're done
          git stash drop
