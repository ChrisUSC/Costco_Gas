name: Update Gas Prices

on:
  schedule:
    - cron: '0 8,16,0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/Los_Angeles

concurrency:
  group: gas-price-scrape
  cancel-in-progress: false  # queue overlapping runs instead of letting them race

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 120
          command: python scraper.py 4

      - name: Commit and push updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add us_history.json us_latest.json ca_history.json ca_latest.json local_history.json local_latest.json index.html
          git diff --staged --quiet || git commit -m "chore: auto-update gas prices [$(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M PT')]"
          git pull --rebase origin main
          git push

