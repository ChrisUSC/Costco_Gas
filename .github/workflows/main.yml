name: Update Gas Prices

on:
  schedule:
    - cron: '0 8,16,0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write  # <--- Added permission so the bot can create PRs

env:
  TZ: America/Los_Angeles

concurrency:
  group: gas-price-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (All Prices)
        run: python gas.py 4

      # THIS REPLACES YOUR MANUAL GIT COMMANDS
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-update gas prices"
          title: "📊 Automated Gas Price Update"
          body: |
            This PR was auto-generated by GitHub Actions.
            It contains the latest scraped gas prices.
            
            **Please review the 'Files changed' tab to ensure no stores were accidentally deleted.**
          branch: "auto-update-prices" # It will use this same branch every time
          delete-branch: true          # Deletes the branch automatically after you merge the PR
