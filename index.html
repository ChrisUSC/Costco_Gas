<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costco Gas Prices Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet & Chart.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Chart.js Time Adapter (Fixes the X-Axis Spacing) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <div class="header-title">
        <h1>Costco Gas Prices</h1>
        <div class="last-updated" id="lastUpdated">Fetching latest data...</div>
    </div>
    <div class="header-controls">
        <div class="search-wrapper" id="searchWrapper">
            <input type="text" id="searchInput" class="search-box" placeholder="Search city or zip code..." autocomplete="off">
            <div class="autocomplete-dropdown" id="autocompleteDropdown"></div>
        </div>

        <!-- Gas Preference Toggle -->
        <div class="gas-toggle">
            <button class="gas-toggle-btn active" id="btn-regular" onclick="setGasPref('regular')">Regular</button>
            <button class="gas-toggle-btn" id="btn-premium" onclick="setGasPref('premium')">Premium</button>
            <button class="gas-toggle-btn" id="btn-diesel" onclick="setGasPref('diesel')">Diesel</button>
        </div>

        <button class="btn-action" onclick="triggerFindMe()">📍 Near Me</button>
        <button class="btn-icon" id="themeToggle" onclick="toggleTheme()" title="Toggle Dark Mode">🌙</button>
    </div>
</header>

<div class="app-container">
    <aside class="sidebar">
        <div class="tabs">
            <div class="tab active" id="tab-nearby" onclick="switchTab('nearby')">Near Me</div>
            <div class="tab" id="tab-lowest" onclick="switchTab('lowest')">State Lowest</div>
            <div class="tab" id="tab-route" onclick="switchTab('route')">Route</div>
            <div class="tab" id="tab-search" onclick="switchTab('search')">All Stores</div>
            <div class="tab" id="tab-favorites" onclick="switchTab('favorites')">Favorites</div>
        </div>
        <div class="sidebar-content" id="sidebarContent"></div>
    </aside>
    <div id="map"></div>
</div>

<!-- Chart Modal -->
<div class="modal-overlay" id="chartModal" onclick="closeHistoryModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeHistoryModal()">×</button>
        <h2 class="modal-title" id="chartTitle">Price History</h2>
        <div class="chart-container">
            <canvas id="priceChart"></canvas>
        </div>
    </div>
</div>

<script src="js/utils.js"></script>
<script src="js/search.js"></script>
<script src="js/charts.js"></script>
<script src="js/routes.js"></script>
<script src="app.js"></script>
</body>
</html>
