name: Update Gas Prices

on:
  schedule:
    # Times are in UTC — 15:00, 20:00, 01:00 UTC = 8am, 1pm, 6pm PT (PST, UTC-8)
    # During PDT (summer, UTC-7): 8am, 1pm, 6pm shifts 1hr earlier
    - cron: '0 15,20,1 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: America/Los_Angeles  # Makes time.localtime() in gas.py use Pacific time

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (All Prices)
        run: python gas.py 4

      - name: Commit and push updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add local_prices.json ca_prices.json us_prices.json
          git diff --staged --quiet || git commit -m "chore: auto-update gas prices [$(TZ=America/Los_Angeles date '+%Y-%m-%d %H:%M PT')]"
          git push
