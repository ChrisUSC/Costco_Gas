name: CA Gas Price Frequency Tracker

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: America/Los_Angeles

concurrency:
  group: ca-gas-price-scrape
  cancel-in-progress: false

jobs:
  track_ca_prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download existing snapshots from R2
        run: python pipeline/r2_sync.py download ca_freq_history.json ca_freq_latest.json
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      - name: Run CA frequency price check
        run: python pipeline/ca_frequency_runner.py

      - name: Run price change velocity analysis
        continue-on-error: true
        run: |
          if [ -f data/snapshots/ca_freq_history.json ]; then
            python pipeline/analyze_price_frequency.py data/snapshots/ca_freq_history.json
          fi

      - name: Upload updated CA frequency files to R2
        run: python pipeline/r2_sync.py upload ca_freq_history.json ca_freq_latest.json
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

